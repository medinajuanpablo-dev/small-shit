      .modal-btn {

      .modal-btn-primary {

      @keyframes modalSlideIn {

        .container {
          padding: 1.5rem;

          border-radius: 15px;

      @media (max-width: 400px) {
        .timer-buttons {
          gap: 1rem;

        }
        .control-button {

          font-size: 1rem;
        }
      }
    </style>

    <script type="module">
      //prettier-ignore
      const { setSignal, setEffect, h } = (() => {let currentObserver=null;function setSignal(value){const subscribers=new Set();const read=()=>{if(currentObserver)subscribers.add(currentObserver);return value;};const write=newValue=>{value=typeof newValue==='function'?newValue(value):newValue;subscribers.forEach(fn=>fn());};return[read,write];}function setEffect(fn){const execute=()=>{currentObserver=execute;fn();currentObserver=null;};execute();}function setMemo(fn){const[get,set]=setSignal();setEffect(()=>set(fn()));return get;}const SVG_NS='http://www.w3.org/2000/svg';const isSvg=tag=>/^(svg|path|circle|rect|line|polygon|polyline|ellipse|g|text|defs|use)$/.test(tag);function Fragment(props){const fragment=document.createDocumentFragment();insertChildren(fragment,props.children);return fragment;}function insertChildren(parent,children){if(!children)return;const childArray=Array.isArray(children)?children.flat():[children];for(const child of childArray){if(child==null||typeof child==='boolean')continue;if(typeof child==='function'){const marker=document.createComment('');let lastValue=null;parent.appendChild(marker);setEffect(()=>{const value=child();if(value===lastValue)return;lastValue=value;let node;while((node=marker.nextSibling)&&node.nodeType!==8)node.remove();if(value==null)return;if(typeof value==='object'&&value.nodeType){parent.insertBefore(value,marker.nextSibling);}else if(typeof value!=='object'){parent.insertBefore(document.createTextNode(String(value)),marker.nextSibling);}});}else if(typeof child==='object'&&child.nodeType){parent.appendChild(child);}else{parent.appendChild(document.createTextNode(String(child)));}}}function jsx(type,props={}){if(typeof type==='function')return type(props);if(type===Fragment)return Fragment(props);const el=isSvg(type)?document.createElementNS(SVG_NS,type):document.createElement(type);for(const key in props){if(key==='children'||key==='ref')continue;if(key.startsWith('on')&&typeof props[key]==='function'){el.addEventListener(key.slice(2).toLowerCase(),props[key]);}else if(key==='style'&&typeof props[key]==='object'){if(typeof props[key]==='function'){setEffect(()=>{Object.assign(el.style,props[key]());});}else{Object.assign(el.style,props[key]);}}else if(key==='className'||key==='class'){if(typeof props[key]==='function'){setEffect(()=>{el.setAttribute('class',props[key]());});}else{el.setAttribute('class',props[key]);}}else if(typeof props[key]!=='function'){el.setAttribute(key,props[key]);}}if(props.ref&&typeof props.ref==='function'){props.ref(el);}insertChildren(el,props.children);return el;}function h(type,props,...children){props=props||{};if(children.length)props.children=children.length===1?children[0]:children;return jsx(type,props);}return{setSignal,setEffect,setMemo,jsx,h,Fragment};})();

      function Modal({ isOpen, onClose, onConfirm, children }) {
        if (!isOpen) return null;
        const handleOverlayClick = e => {
          if (e.target === e.currentTarget) {
            onClose();
          }
        };
        const handleKeyDown = e => {
          if (e.key === 'Escape') {
            onClose();
          } else if (e.key === 'Enter' && onConfirm) {
            e.preventDefault();
            onConfirm();
          }
        };
        setEffect(() => {
          if (isOpen) {
            document.addEventListener('keydown', handleKeyDown);
            return () => {
              document.removeEventListener('keydown', handleKeyDown);
            };
          }
        });
        return h(
          'div',
          { className: 'modal-overlay', onclick: handleOverlayClick },
          h('div', { className: 'modal-content' }, h('button', { className: 'modal-close', onclick: onClose }, '×'), children)
        );
      }

      function ConfirmDelete({ isOpen, onClose, onConfirm, projectName }) {
        const confirmContent = h(
          'div',
          { className: 'modal-form' },
          h('h3', { className: 'modal-title' }, '⚠️ Confirmar Eliminación'),
          h('p', { className: 'confirm-warning-text' }, `¿Estás seguro que deseas eliminar el proyecto "${projectName}"?`),
          h(
            'div',
            { className: 'modal-buttons' },
            h('button', { type: 'button', className: 'modal-btn modal-btn-secondary', onclick: onClose }, 'Cancelar'),
            h('button', { type: 'button', className: 'modal-btn modal-btn-delete', onclick: onConfirm }, 'Eliminar')
          )
        );
        return Modal({ isOpen, onClose, onConfirm, children: confirmContent });
      }

      function ConfirmNewDay({ isOpen, onClose, onConfirm }) {
        const confirmContent = h(
          'div',
          { className: 'modal-form' },
          h('h3', { className: 'modal-title' }, '🔄 Confirmar New Day'),
          h('p', { className: 'confirm-warning-text' }, '¿Estás seguro que deseas reiniciar todos los contadores de tiempo a 0?'),
          h(
            'p',
            { className: 'confirm-warning-text', style: 'font-size: 0.9rem; color: #e74c3c; margin-top: 1rem;' },
            'Esta acción reiniciará todos los proyectos. No se puede deshacer.'
          ),
          h(
            'div',
            { className: 'modal-buttons' },
            h('button', { type: 'button', className: 'modal-btn modal-btn-secondary', onclick: onClose }, 'Cancelar'),
            h('button', { type: 'button', className: 'modal-btn modal-btn-delete', onclick: onConfirm }, 'Sí, Reiniciar Todo')
          )
        );
        return Modal({ isOpen, onClose, onConfirm, children: confirmContent });
      }

      function ProjectsList({
        projects,
        setProjects,
        onStartProject,
        onDeleteProject,
        onAddProject,
        onNewDay,
        formatTimeAccumulated,
        parseTimeInput,
      }) {
        const [isAddModalOpen, setIsAddModalOpen] = setSignal(false);
        const [newProjectName, setNewProjectName] = setSignal('');
        const [selectedColor, setSelectedColor] = setSignal('red');
        const [targetTimeInput, setTargetTimeInput] = setSignal('');
        const [isDeleteConfirmOpen, setIsDeleteConfirmOpen] = setSignal(false);
        const [projectToDelete, setProjectToDelete] = setSignal(null);
        const [isNewDayConfirmOpen, setIsNewDayConfirmOpen] = setSignal(false);

        const handleAddProject = () => {
          const name = newProjectName().trim();
          if (name.length === 0) return;
          const targetTime = parseTimeInput(targetTimeInput()) || 0;
          const newProject = { id: Date.now(), name, color: selectedColor(), timeInSeconds: 0, targetTimeInSeconds: targetTime };
          setProjects([...projects(), newProject]);
          setNewProjectName('');
          setSelectedColor('red');
          setTargetTimeInput('');
          setIsAddModalOpen(false);
        };

        setEffect(() => {
          if (isAddModalOpen()) {
            setTimeout(() => {
              const projectNameInput = document.querySelector('#project-name-input');
              const targetTimeInputEl = document.querySelector('#target-time-input');
              if (projectNameInput) {
                projectNameInput.value = '';
              }
              if (targetTimeInputEl) {
                targetTimeInputEl.value = '';
              }
            }, 10);
          }
        });

        const colorOptions = [
          { value: 'red', className: 'color-red' },
          { value: 'green', className: 'color-green' },
          { value: 'blue', className: 'color-blue' },
          { value: 'purple', className: 'color-purple' },
          { value: 'orange', className: 'color-orange' },
        ];

        return h(
          'div',
          null,
          h('h1', null, 'Elegir proyecto'),
          () =>
            h(
              'div',
              { className: 'projects-list' },
              ...projects().map(project =>
                h(
                  'div',
                  {
                    key: project.id,
                    className: 'project-item',
                    onclick: () => onStartProject(project),
                  },
                  h('div', { className: `project-name-cell text-color-${project.color}` }, project.name),
                  h(
                    'div',
                    { className: 'project-count-with-target' },
                    h('div', { className: 'project-count' }, () => formatTimeAccumulated(project.timeInSeconds)),
                    () => {
                      if (project.targetTimeInSeconds && project.targetTimeInSeconds > 0) {
                        return h('div', { className: 'project-target-time' }, `/ ${formatTimeAccumulated(project.targetTimeInSeconds)}`);
                      }
                      return null;
                    }
                  ),
                  h(
                    'button',
                    {
                      className: 'project-button btn-start',
                      onclick: e => {
                        e.stopPropagation();
                        onStartProject(project);
                      },
                    },
                    'Iniciar'
                  ),
                  h(
                    'button',
                    {
                      className: 'project-button btn-delete',
                      onclick: e => {
                        e.stopPropagation();
                        setProjectToDelete(project);
                        setIsDeleteConfirmOpen(true);
                      },
                    },
                    '🗑️'
                  )
                )
              )
            ),
          () => h('button', { className: 'add-project-button', onclick: () => setIsAddModalOpen(true) }, '+ Agregar Proyecto'),
          () => h('button', { className: 'new-day-button', onclick: () => setIsNewDayConfirmOpen(true) }, '🔄 New Day'),
          () =>
            ConfirmDelete({
              isOpen: isDeleteConfirmOpen(),
              onClose: () => {
                setIsDeleteConfirmOpen(false);
                setProjectToDelete(null);
              },
              onConfirm: () => {
                if (projectToDelete()) {
                  onDeleteProject(projectToDelete().id);
                  setIsDeleteConfirmOpen(false);
                  setProjectToDelete(null);
                }
              },
              projectName: projectToDelete()?.name || '',
            }),
          () =>
            ConfirmNewDay({
              isOpen: isNewDayConfirmOpen(),
              onClose: () => setIsNewDayConfirmOpen(false),
              onConfirm: () => {
                onNewDay();
                setIsNewDayConfirmOpen(false);
              },
            }),
          () =>
            Modal({
              isOpen: isAddModalOpen(),
              onClose: () => {
                setIsAddModalOpen(false);
                setNewProjectName('');
                setSelectedColor('red');
                setTargetTimeInput('');
              },
              onConfirm: () => {
                if (newProjectName().trim().length > 0) {
                  handleAddProject();
                }
              },
              children: h(
                'div',
                { className: 'modal-form' },
                h('h3', { className: 'modal-title' }, 'Agregar Proyecto'),
                h('input', {
                  id: 'project-name-input',
                  className: 'modal-input',
                  type: 'text',
                  placeholder: 'Nombre del proyecto',
                  oninput: e => setNewProjectName(e.target.value),
                }),
                h('input', {
                  id: 'target-time-input',
                  className: 'modal-input',
                  type: 'text',
                  placeholder: 'Tiempo objetivo (opcional, ej: 2 h 30 m)',
                  oninput: e => setTargetTimeInput(e.target.value),
                }),
                h(
                  'div',
                  { className: 'color-options' },
                  ...colorOptions.map(option =>
                    h('div', {
                      className: () => `color-option ${option.className} ${selectedColor() === option.value ? 'selected' : ''}`,
                      onclick: () => setSelectedColor(option.value),
                    })
                  )
                ),
                h(
                  'div',
                  { className: 'modal-buttons' },
                  h(
                    'button',
                    { type: 'button', className: 'modal-btn modal-btn-secondary', onclick: () => setIsAddModalOpen(false) },
                    'Cancelar'
                  ),
                  h(
                    'button',
                    {
                      type: 'button',
                      className: () => `modal-btn modal-btn-primary ${newProjectName().trim().length === 0 ? 'disabled' : ''}`,
                      onclick: handleAddProject,
                    },
                    'Agregar'
                  )
                )
              ),
            })
        );
      }

      function PomodoroTimer({
        currentProject,
        onBack,
        onAddTime,
        onSetTime,
        onSetTargetTime,
        formatTimeAccumulated,
        view,
        parseTimeInput,
      }) {
        const [elapsedSeconds, setElapsedSeconds] = setSignal(0);
        const [isRunning, setIsRunning] = setSignal(false);
        const [intervalId, setIntervalId] = setSignal(null);
        const [startTime, setStartTime] = setSignal(null);
        const [isEditModalOpen, setIsEditModalOpen] = setSignal(false);
        const [manualTimeInput, setManualTimeInput] = setSignal('');
        const [targetTimeInput, setTargetTimeInput] = setSignal('');
        const [lastSavedSeconds, setLastSavedSeconds] = setSignal(0);

        const formatTime = seconds => {
          const hours = Math.floor(seconds / 3600);
          const mins = Math.floor((seconds % 3600) / 60);
          const secs = seconds % 60;
          if (hours > 0) {
            return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
          }
          return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        };

        const updateTimer = () => {
          if (!isRunning() || !startTime() || !intervalId()) return;
          const now = Date.now();
          const elapsed = Math.floor((now - startTime()) / 1000);
          setElapsedSeconds(elapsed);
          if (currentProject() && elapsed > lastSavedSeconds()) {
            const secondsToAdd = elapsed - lastSavedSeconds();
            onAddTime(secondsToAdd);
            setLastSavedSeconds(elapsed);
          }
        };

        const startTimer = () => {
          if (intervalId()) {
            clearInterval(intervalId());
            setIntervalId(null);
          }
          setIsRunning(true);
          const now = Date.now();
          setStartTime(now);
          setLastSavedSeconds(0);
          setElapsedSeconds(0);
          updateTimer();
          const id = setInterval(updateTimer, 1000);
          setIntervalId(id);
        };

        const pauseTimer = () => {
          if (!isRunning()) return;
          if (intervalId()) {
            clearInterval(intervalId());
            setIntervalId(null);
          }
          if (elapsedSeconds() > lastSavedSeconds() && currentProject()) {
            const secondsToAdd = elapsedSeconds() - lastSavedSeconds();
            onAddTime(secondsToAdd);
          }
          setIsRunning(false);
          setStartTime(null);
          setElapsedSeconds(0);
          setLastSavedSeconds(0);
        };

        const handleSetTime = () => {
          const seconds = parseTimeInput(manualTimeInput());
          if (seconds === null || seconds < 0) return;
          onSetTime(seconds);
          const targetSeconds = parseTimeInput(targetTimeInput());
          if (targetSeconds !== null && targetSeconds >= 0) {
            onSetTargetTime(targetSeconds);
          }
          setManualTimeInput('');
          setTargetTimeInput('');
          setIsEditModalOpen(false);
        };

        setEffect(() => {
          if (view() !== 'timer' || !currentProject()) {
            if (isRunning()) {
              if (elapsedSeconds() > lastSavedSeconds() && currentProject()) {
                const secondsToAdd = elapsedSeconds() - lastSavedSeconds();
                onAddTime(secondsToAdd);
              }
              if (intervalId()) {
                clearInterval(intervalId());
                setIntervalId(null);
              }
              setIsRunning(false);
              setStartTime(null);
              setElapsedSeconds(0);
              setLastSavedSeconds(0);
            }
          }
        });

        setEffect(() => {
          if (isEditModalOpen()) {
            setTimeout(() => {
              const timeInput = document.querySelector('#manual-time-input');
              const targetTimeInputEl = document.querySelector('#target-time-input-edit');
              if (timeInput) {
                const currentValue = currentProject()?.timeInSeconds || 0;
                const hours = Math.floor(currentValue / 3600);
                const minutes = Math.floor((currentValue % 3600) / 60);
                const seconds = currentValue % 60;
                let displayValue = '';
                if (hours > 0) displayValue += `${hours} h `;
                if (minutes > 0) displayValue += `${minutes} m `;
                if (seconds > 0 || displayValue === '') displayValue += `${seconds} s`;
                timeInput.value = displayValue.trim();
                setManualTimeInput(displayValue.trim());
              }
              if (targetTimeInputEl) {
                const targetValue = currentProject()?.targetTimeInSeconds || 0;
                if (targetValue > 0) {
                  const hours = Math.floor(targetValue / 3600);
                  const minutes = Math.floor((targetValue % 3600) / 60);
                  const seconds = targetValue % 60;
                  let displayValue = '';
                  if (hours > 0) displayValue += `${hours} h `;
                  if (minutes > 0) displayValue += `${minutes} m `;
                  if (seconds > 0 || displayValue === '') displayValue += `${seconds} s`;
                  targetTimeInputEl.value = displayValue.trim();
                  setTargetTimeInput(displayValue.trim());
                } else {
                  targetTimeInputEl.value = '';
                  setTargetTimeInput('');
                }
              }
            }, 10);
          }
        });

        return h(
          'div',
          null,
          h(
            'div',
            { className: 'project-header' },
            h(
              'div',
              { className: 'project-header-info' },
              h(
                'div',
                { className: () => `project-name text-color-${currentProject()?.color || ''}` },
                () => currentProject()?.name || 'Cronómetro'
              ),
              h('div', { className: 'project-header-pomodoros' }, () => {
                const project = currentProject();
                if (!project) return '';
                return h(
                  'div',
                  { className: 'project-count-with-target' },
                  h('div', null, formatTimeAccumulated(project.timeInSeconds)),
                  project.targetTimeInSeconds && project.targetTimeInSeconds > 0
                    ? h('div', { className: 'project-target-time' }, `/ ${formatTimeAccumulated(project.targetTimeInSeconds)}`)
                    : null
                );
              })
            ),
            h('button', { className: 'add-manual-button', onclick: () => setIsEditModalOpen(true) }, 'Editar'),
            h(
              'button',
              {
                className: 'back-button',
                onclick: () => {
                  if (isRunning()) {
                    pauseTimer();
                  }
                  onBack();
                },
              },
              '← Volver'
            )
          ),
          h(
            'div',
            { className: 'timer-display' },
            h('div', { className: 'time' }, () => formatTime(elapsedSeconds()))
          ),
          h(
            'button',
            {
              className: () => (isRunning() ? 'control-button btn-stop' : 'control-button btn-continue'),
              onclick: () => (isRunning() ? pauseTimer() : startTimer()),
            },
            () => (isRunning() ? 'Pausar' : 'Iniciar')
          ),
          () =>
            Modal({
              isOpen: isEditModalOpen(),
              onClose: () => {
                setIsEditModalOpen(false);
                setManualTimeInput('');
                setTargetTimeInput('');
              },
              onConfirm: () => {
                const seconds = parseTimeInput(manualTimeInput());
                if (seconds !== null && seconds >= 0) {
                  handleSetTime();
                }
              },
              children: h(
                'div',
                { className: 'modal-form' },
                h('h3', { className: 'modal-title' }, 'Editar Tiempo'),
                h('input', {
                  id: 'manual-time-input',
                  className: 'modal-input',
                  type: 'text',
                  placeholder: 'Tiempo (ej: 1 h 30 m 45 s o 5445)',
                  oninput: e => setManualTimeInput(e.target.value),
                }),
                h('input', {
                  id: 'target-time-input-edit',
                  className: 'modal-input',
                  type: 'text',
                  placeholder: 'Tiempo objetivo (opcional, ej: 2 h 30 m)',
                  oninput: e => setTargetTimeInput(e.target.value),
                }),
                h(
                  'div',
                  { className: 'modal-buttons' },
                  h(
                    'button',
                    { type: 'button', className: 'modal-btn modal-btn-secondary', onclick: () => setIsEditModalOpen(false) },
                    'Cancelar'
                  ),
                  h(
                    'button',
                    {
                      type: 'button',
                      className: () =>
                        `modal-btn modal-btn-primary ${
                          parseTimeInput(manualTimeInput()) === null || parseTimeInput(manualTimeInput()) < 0 ? 'disabled' : ''
                        }`,
                      onclick: handleSetTime,
                    },
                    'Guardar'
                  )
                )
              ),
            })
        );
      }

      function PomodoroApp() {
        const STORAGE_KEY = 'pomodoro_projects_v2';
        const defaultProjects = [
          { id: 1, name: 'Browserbase', color: 'red', timeInSeconds: 0, targetTimeInSeconds: 0 },
          { id: 2, name: 'DrLullaby', color: 'green', timeInSeconds: 0, targetTimeInSeconds: 0 },
          { id: 3, name: 'Work Defense', color: 'blue', timeInSeconds: 0, targetTimeInSeconds: 0 },
        ];

        const loadProjects = () => {
          try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
              const projects = JSON.parse(saved);
              return projects.map(p => ({
                ...p,
                timeInSeconds: p.timeInSeconds !== undefined ? p.timeInSeconds : p.pomodoros ? p.pomodoros * 25 * 60 : 0,
                targetTimeInSeconds: p.targetTimeInSeconds !== undefined ? p.targetTimeInSeconds : 0,
              }));
            }
          } catch (error) {
            console.error('Error loading projects:', error);
          }
          return defaultProjects;
        };

        const saveProjects = projects => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
          } catch (error) {
            console.error('Error saving projects:', error);
          }
        };

        const [projects, setProjects] = setSignal(loadProjects());
        const [currentProject, setCurrentProject] = setSignal(null);
        const [view, setView] = setSignal('list');

        setEffect(() => {
          saveProjects(projects());
        });

        const onStartProject = project => {
          setCurrentProject(project);
          setView('timer');
        };

        const onBack = () => {
          setView('list');
          setCurrentProject(null);
        };

        const onDeleteProject = projectId => {
          setProjects(projects().filter(p => p.id !== projectId));
          if (currentProject()?.id === projectId) {
            setCurrentProject(null);
            setView('list');
          }
        };

        const onAddProject = () => {};

        const onNewDay = () => {
          setProjects(projects().map(p => ({ ...p, timeInSeconds: 0 })));
        };

        const onAddTime = seconds => {
          const project = currentProject();
          if (project) {
            const updatedProjects = projects().map(p => (p.id === project.id ? { ...p, timeInSeconds: p.timeInSeconds + seconds } : p));
            setProjects(updatedProjects);
            setCurrentProject(updatedProjects.find(p => p.id === project.id));
          }
        };

        const onSetTime = seconds => {
          const project = currentProject();
          if (project) {
            const updatedProjects = projects().map(p => (p.id === project.id ? { ...p, timeInSeconds: seconds } : p));
            setProjects(updatedProjects);
            setCurrentProject(updatedProjects.find(p => p.id === project.id));
          }
        };

        const onSetTargetTime = seconds => {
          const project = currentProject();
          if (project) {
            const updatedProjects = projects().map(p => (p.id === project.id ? { ...p, targetTimeInSeconds: seconds } : p));
            setProjects(updatedProjects);
            setCurrentProject(updatedProjects.find(p => p.id === project.id));
          }
        };

        const parseTimeInput = input => {
          const trimmed = input.trim();
          if (!trimmed) return null;
          const numOnly = /^\d+$/.test(trimmed);
          if (numOnly) {
            const seconds = parseInt(trimmed, 10);
            return isNaN(seconds) ? null : seconds;
          }
          let hours = 0;
          let minutes = 0;
          let seconds = 0;
          const hourMatch = trimmed.match(/(\d+)\s*h/i);
          const minuteMatch = trimmed.match(/(\d+)\s*m/i);
          const secondMatch = trimmed.match(/(\d+)\s*s/i);
          if (hourMatch) {
            const h = parseInt(hourMatch[1], 10);
            if (!isNaN(h)) hours = h;
          }
          if (minuteMatch) {
            const m = parseInt(minuteMatch[1], 10);
            if (!isNaN(m)) minutes = m;
          }
          if (secondMatch) {
            const s = parseInt(secondMatch[1], 10);
            if (!isNaN(s)) seconds = s;
          }
          if (hourMatch || minuteMatch || secondMatch) {
            return hours * 3600 + minutes * 60 + seconds;
          }
          const parts = trimmed.split(/\s+/).filter(p => p && !/[hms]/i.test(p));
          if (parts.length === 1) {
            const secs = parseInt(parts[0], 10);
            return isNaN(secs) ? null : secs;
          }
          if (parts.length === 2) {
            const mins = parseInt(parts[0], 10);
            const secs = parseInt(parts[1], 10);
            if (isNaN(mins) || isNaN(secs)) return null;
            return mins * 60 + secs;
          }
          if (parts.length === 3) {
            const hrs = parseInt(parts[0], 10);
            const mins = parseInt(parts[1], 10);
            const secs = parseInt(parts[2], 10);
            if (isNaN(hrs) || isNaN(mins) || isNaN(secs)) return null;
            return hrs * 3600 + mins * 60 + secs;
          }
          return null;
        };

        const formatTimeAccumulated = seconds => {
          const hours = Math.floor(seconds / 3600);
          const minutes = Math.floor((seconds % 3600) / 60);
          const secs = seconds % 60;
          const parts = [];
          if (hours > 0) parts.push(`${hours} h`);
          if (minutes > 0) parts.push(`${minutes} m`);
          if (secs > 0 || parts.length === 0) parts.push(`${secs} s`);
          return parts.join(' ');
        };

        return h('div', { className: 'container' }, () =>
          view() === 'list'
            ? ProjectsList({
                projects,
                setProjects,
                onStartProject,
                onDeleteProject,
                onAddProject,
                onNewDay,
                formatTimeAccumulated,
                parseTimeInput,
              })
            : PomodoroTimer({ currentProject, onBack, onAddTime, onSetTime, onSetTargetTime, formatTimeAccumulated, view, parseTimeInput })
        );
      }

      const root = document.body;
      root.appendChild(PomodoroApp());
    </script>
  </body>
</html>
